<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<div id="quote-app">
  <header class="topbar">
    <a class="brand" href="#top" aria-label="回到金句收藏庫首頁">
      <span class="brand-mark" aria-hidden="true">句</span>
      <span class="brand-copy">
        <span class="brand-kicker">PERSONAL QUOTE LIBRARY</span>
        <strong>金句收藏庫</strong>
      </span>
    </a>
    <div class="topbar-meta"><span class="status-dot" aria-hidden="true"></span>只限本人</div>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">READ · KEEP · RETURN</p>
        <h1 id="hero-title">把讀到的句子，<br><em>留成日後找得到的光。</em></h1>
        <p class="hero-intro">從 LINE 收進來的每一則金句，都在這裡留下自己的位置。搜尋、整理，或隨機翻開下一張卡片。</p>
      </div>
      <div class="hero-panel" aria-label="收藏統計">
        <div class="hero-panel-glow" aria-hidden="true"></div>
        <p class="panel-label">LIBRARY SNAPSHOT</p>
        <div class="hero-number" id="total-metric">—</div>
        <p class="hero-number-label">則已確認收藏</p>
        <div class="hero-divider"></div>
        <div class="hero-mini-row"><span>目前顯示</span><strong id="visible-metric">—</strong></div>
      </div>
    </section>

    <section class="library-toolbar" aria-label="搜尋與篩選">
      <div class="toolbar-heading">
        <p class="eyebrow">YOUR LIBRARY</p>
        <h2>翻閱收藏</h2>
      </div>
      <div class="toolbar-fields">
        <label class="search-field">
          <span class="field-label">搜尋</span>
          <span class="input-wrap"><span class="search-icon" aria-hidden="true"></span><input id="search-input" type="search" placeholder="搜尋金句、來源或標籤" autocomplete="off"></span>
        </label>
        <label>
          <span class="field-label">分類</span>
          <select id="category-select">
            <option value="">全部分類</option>
            <option>工作學習</option>
            <option>健康醫療</option>
            <option>人際生活</option>
            <option>理財投資</option>
            <option>創意靈感</option>
            <option>其他</option>
          </select>
        </label>
        <label>
          <span class="field-label">標籤</span>
          <select id="tag-select">
            <option value="">全部標籤</option>
          </select>
        </label>
      </div>
    </section>

    <div class="result-bar">
      <p id="result-count" role="status" aria-live="polite">讀取收藏中…</p>
      <div class="result-actions">
        <button id="show-all-button" class="text-button" type="button" hidden>查看全部</button>
        <button id="random-button" class="random-button" type="button"><span aria-hidden="true">✦</span> 隨機回顧</button>
      </div>
    </div>

    <main id="quote-list" class="quote-grid" aria-live="polite"></main>
  </main>

  <footer class="footer-note"><span>金句收藏助手</span><span aria-hidden="true">·</span><span>每一次閱讀，都值得被記住</span></footer>
</div>

<style>
  :root {
    --ink: #173b35;
    --ink-soft: #55736c;
    --paper: #fbfaf5;
    --paper-deep: #f2f1e9;
    --mint: #dcefe5;
    --mint-deep: #b9dfcc;
    --green: #087f5b;
    --green-dark: #075541;
    --coral: #d77b5f;
    --line: #d9e2da;
    --shadow: 0 20px 48px rgba(20, 57, 48, .09);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; min-width: 320px; background: var(--paper); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .32; background-image: radial-gradient(#b3c9bd .65px, transparent .65px); background-size: 18px 18px; mask-image: linear-gradient(to bottom, black, transparent 72%); }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid rgba(8, 127, 91, .32); outline-offset: 3px; }

  #quote-app { position: relative; width: min(1120px, 100%); margin: 0 auto; padding: 0 28px 48px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 78px; border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; }
  .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px 13px 13px 4px; background: var(--green); color: #fff; font-family: Georgia, "Noto Serif TC", serif; font-size: 21px; box-shadow: 0 7px 16px rgba(8, 127, 91, .2); }
  .brand-copy { display: grid; gap: 2px; }
  .brand-kicker, .eyebrow, .panel-label { font-size: 10px; font-weight: 800; letter-spacing: .16em; }
  .brand-kicker { color: var(--green); }
  .brand-copy strong { font-family: Georgia, "Noto Serif TC", serif; font-size: 20px; letter-spacing: .04em; }
  .topbar-meta { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-soft); font-size: 12px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #44b883; box-shadow: 0 0 0 4px rgba(68, 184, 131, .13); }

  .hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(260px, .8fr); gap: 42px; align-items: end; padding: 72px 0 64px; }
  .eyebrow { margin: 0 0 13px; color: var(--green); }
  h1, h2, p { margin-top: 0; }
  h1 { max-width: 700px; margin-bottom: 22px; font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(42px, 7vw, 76px); font-weight: 500; letter-spacing: -.045em; line-height: 1.08; }
  h1 em { color: var(--green); font-style: normal; }
  .hero-intro { max-width: 520px; margin-bottom: 0; color: var(--ink-soft); font-size: 16px; line-height: 1.85; }
  .hero-panel { position: relative; overflow: hidden; min-height: 220px; padding: 27px 29px; border-radius: 24px 24px 24px 5px; background: var(--green-dark); color: #f5fff9; box-shadow: var(--shadow); }
  .hero-panel-glow { position: absolute; top: -80px; right: -50px; width: 190px; height: 190px; border-radius: 50%; background: rgba(98, 212, 160, .28); filter: blur(2px); }
  .panel-label { position: relative; margin-bottom: 25px; color: #9fddc1; }
  .hero-number { position: relative; font-family: Georgia, "Noto Serif TC", serif; font-size: 64px; line-height: .9; }
  .hero-number-label { position: relative; margin: 11px 0 22px; color: #d3f0df; font-size: 13px; }
  .hero-divider { position: relative; height: 1px; margin-bottom: 14px; background: rgba(255,255,255,.2); }
  .hero-mini-row { position: relative; display: flex; justify-content: space-between; color: #b5dfca; font-size: 12px; }
  .hero-mini-row strong { color: #fff; font-size: 14px; }

  .library-toolbar { display: grid; grid-template-columns: 190px 1fr; gap: 28px; align-items: end; padding: 25px 27px 27px; border: 1px solid var(--line); border-radius: 22px; background: rgba(255,255,255,.72); box-shadow: 0 12px 30px rgba(27, 62, 51, .04); }
  .toolbar-heading h2 { margin: 0; font-family: Georgia, "Noto Serif TC", serif; font-size: 30px; font-weight: 500; }
  .toolbar-heading .eyebrow { margin-bottom: 8px; }
  .toolbar-fields { display: grid; grid-template-columns: 1.7fr 1fr 1fr; gap: 11px; }
  label { display: block; min-width: 0; }
  .field-label { display: block; margin: 0 0 7px 3px; color: var(--ink-soft); font-size: 11px; font-weight: 700; letter-spacing: .05em; }
  input, select { width: 100%; min-height: 46px; border: 1px solid #cbdad1; border-radius: 12px; padding: 10px 13px; background: #fff; color: var(--ink); transition: border-color .18s, box-shadow .18s; }
  input::placeholder { color: #91a49d; }
  input:hover, select:hover { border-color: #8ebaa6; }
  input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(8, 127, 91, .1); outline: 0; }
  .input-wrap { position: relative; display: block; }
  .input-wrap input { padding-left: 40px; }
  .search-icon { position: absolute; z-index: 1; top: 15px; left: 15px; width: 13px; height: 13px; border: 1.7px solid var(--ink-soft); border-radius: 50%; pointer-events: none; }
  .search-icon::after { content: ""; position: absolute; right: -5px; bottom: -3px; width: 6px; height: 1.7px; transform: rotate(45deg); background: var(--ink-soft); }

  .result-bar { display: flex; align-items: center; justify-content: space-between; min-height: 83px; }
  #result-count { margin: 0; color: var(--ink-soft); font-size: 13px; }
  .result-actions { display: flex; align-items: center; gap: 13px; }
  .text-button { border: 0; padding: 8px 0; background: transparent; color: var(--green); font-size: 13px; font-weight: 700; }
  .random-button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--green); border-radius: 999px; padding: 10px 15px; background: var(--green); color: #fff; font-size: 13px; font-weight: 700; box-shadow: 0 6px 14px rgba(8,127,91,.16); transition: transform .18s, background .18s; }
  .random-button span { font-size: 16px; line-height: 0; }
  .random-button:hover { transform: translateY(-2px); background: var(--green-dark); }
  .quote-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; }
  .quote-card { position: relative; min-height: 265px; display: flex; flex-direction: column; padding: 27px 28px 23px; overflow: hidden; border: 1px solid var(--line); border-radius: 22px 22px 22px 5px; background: rgba(255,255,255,.88); box-shadow: 0 10px 30px rgba(24, 61, 49, .055); transition: transform .18s, box-shadow .18s, border-color .18s; }
  .quote-card::before { content: "“"; position: absolute; top: 7px; right: 22px; color: var(--mint); font-family: Georgia, serif; font-size: 112px; line-height: 1; pointer-events: none; }
  .quote-card:hover { transform: translateY(-3px); border-color: var(--mint-deep); box-shadow: 0 18px 38px rgba(24, 61, 49, .1); }
  .card-top { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 21px; }
  .category-chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 10px; background: var(--mint); color: var(--green-dark); font-size: 11px; font-weight: 800; }
  .quote-index { color: #91a49d; font-family: ui-monospace, monospace; font-size: 11px; }
  .quote-text { position: relative; z-index: 1; margin: 0 0 25px; font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(20px, 2.4vw, 27px); font-weight: 500; letter-spacing: -.02em; line-height: 1.65; }
  .card-bottom { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: space-between; gap: 15px; margin-top: auto; padding-top: 17px; border-top: 1px solid #e6eee8; }
  .quote-meta { min-width: 0; margin: 0; color: var(--ink-soft); font-size: 11px; line-height: 1.65; }
  .quote-meta strong { display: block; overflow: hidden; color: var(--ink); font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
  .tag-list { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
  .tag { border: 1px solid #d9e9df; border-radius: 999px; padding: 4px 8px; background: #f4faf6; color: var(--green); font-size: 10px; white-space: nowrap; }
  .empty-state { grid-column: 1 / -1; padding: 78px 24px; border: 1px dashed #b9d0c3; border-radius: 22px; background: rgba(255,255,255,.54); color: var(--ink-soft); text-align: center; line-height: 1.8; }
  .empty-state::before { content: "✦"; display: block; margin-bottom: 12px; color: var(--green); font-size: 22px; }
  .footer-note { display: flex; justify-content: center; gap: 10px; padding-top: 54px; color: #8ca39a; font-size: 11px; letter-spacing: .05em; }

  @media (max-width: 820px) {
    #quote-app { padding-right: 18px; padding-left: 18px; }
    .hero { grid-template-columns: 1fr; gap: 28px; padding-top: 52px; }
    .hero-panel { width: min(360px, 100%); }
    .library-toolbar { grid-template-columns: 1fr; gap: 20px; }
  }
  @media (max-width: 620px) {
    .topbar { min-height: 68px; }
    .brand-copy strong { font-size: 18px; }
    .topbar-meta { font-size: 0; }
    .topbar-meta .status-dot { width: 9px; height: 9px; }
    .hero { padding: 43px 0 42px; }
    h1 { font-size: clamp(39px, 12vw, 58px); }
    .hero-intro { font-size: 14px; }
    .toolbar-fields { grid-template-columns: 1fr 1fr; }
    .search-field { grid-column: 1 / -1; }
    .quote-grid { grid-template-columns: 1fr; }
    .quote-card { min-height: 245px; padding: 23px 21px 20px; }
    .result-bar { min-height: 76px; }
    .result-actions { gap: 9px; }
    .random-button { padding: 9px 11px; }
    .random-button span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0s !important; }
  }
</style>

<script>
  (function () {
    var allQuotes = [];
    var randomOnly = false;
    var list = document.getElementById('quote-list');
    var count = document.getElementById('result-count');
    var search = document.getElementById('search-input');
    var category = document.getElementById('category-select');
    var tag = document.getElementById('tag-select');
    var randomButton = document.getElementById('random-button');
    var showAllButton = document.getElementById('show-all-button');
    var totalMetric = document.getElementById('total-metric');
    var visibleMetric = document.getElementById('visible-metric');

    function text(value) {
      return String(value || '').toLocaleLowerCase('zh-Hant');
    }

    function sourceLine(quote) {
      return [quote.sourceTitle, quote.sourceAuthor].filter(Boolean).join(' · ');
    }

    function makeCard(quote, index) {
      var article = document.createElement('article');
      article.className = 'quote-card';

      var top = document.createElement('div');
      top.className = 'card-top';
      var categoryChip = document.createElement('span');
      categoryChip.className = 'category-chip';
      categoryChip.textContent = quote.category || '其他';
      top.appendChild(categoryChip);
      var indexLabel = document.createElement('span');
      indexLabel.className = 'quote-index';
      indexLabel.textContent = String(index + 1).padStart(2, '0');
      top.appendChild(indexLabel);
      article.appendChild(top);

      var quoteText = document.createElement('p');
      quoteText.className = 'quote-text';
      quoteText.textContent = '「' + quote.quote + '」';
      article.appendChild(quoteText);

      var bottom = document.createElement('div');
      bottom.className = 'card-bottom';
      var meta = document.createElement('p');
      meta.className = 'quote-meta';
      var source = sourceLine(quote);
      var strong = document.createElement('strong');
      strong.textContent = source || '未記錄來源';
      meta.appendChild(strong);
      var dateLine = document.createElement('span');
      dateLine.textContent = [quote.createdAt, quote.id].filter(Boolean).join(' · ');
      meta.appendChild(dateLine);
      bottom.appendChild(meta);

      var tags = document.createElement('div');
      tags.className = 'tag-list';
      (quote.tags || []).forEach(function (value) {
        var item = document.createElement('span');
        item.className = 'tag';
        item.textContent = value;
        tags.appendChild(item);
      });
      bottom.appendChild(tags);
      article.appendChild(bottom);
      return article;
    }

    function filteredQuotes() {
      var query = text(search.value).trim();
      return allQuotes.filter(function (quote) {
        var haystack = text([
          quote.quote,
          quote.sourceTitle,
          quote.sourceAuthor,
          quote.category,
          (quote.tags || []).join(' ')
        ].join(' '));
        return (!query || haystack.indexOf(query) !== -1) &&
          (!category.value || quote.category === category.value) &&
          (!tag.value || (quote.tags || []).indexOf(tag.value) !== -1);
      });
    }

    function render() {
      var items = filteredQuotes();
      if (randomOnly && items.length) items = [items[Math.floor(Math.random() * items.length)]];
      list.replaceChildren();
      count.textContent = randomOnly && items.length ? '隨機回顧 1 則' : '共 ' + items.length + ' 則收藏';
      totalMetric.textContent = allQuotes.length;
      visibleMetric.textContent = items.length + ' 則';
      showAllButton.hidden = !randomOnly;
      randomButton.innerHTML = randomOnly ? '<span aria-hidden="true">↺</span> 再看全部' : '<span aria-hidden="true">✦</span> 隨機回顧';

      if (!items.length) {
        var empty = document.createElement('p');
        empty.className = 'empty-state';
        empty.textContent = allQuotes.length ? '找不到符合條件的金句，試著換個關鍵字。' : '還沒有收藏，先從 LINE 上傳一張圖片。';
        list.appendChild(empty);
        return;
      }
      items.forEach(function (quote, index) { list.appendChild(makeCard(quote, index)); });
    }

    function setQuotes(quotes) {
      allQuotes = Array.isArray(quotes) ? quotes : [];
      var tags = {};
      allQuotes.forEach(function (quote) {
        (quote.tags || []).forEach(function (value) { tags[value] = true; });
      });
      Object.keys(tags).sort().forEach(function (value) {
        var option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        tag.appendChild(option);
      });
      render();
    }

    function showError(error) {
      list.replaceChildren();
      var message = document.createElement('p');
      message.className = 'empty-state';
      message.textContent = '無法讀取收藏：' + (error && error.message || '未知錯誤');
      list.appendChild(message);
      count.textContent = '讀取失敗';
      totalMetric.textContent = '—';
      visibleMetric.textContent = '—';
    }

    [search, category, tag].forEach(function (control) {
      control.addEventListener('input', function () { randomOnly = false; render(); });
      control.addEventListener('change', function () { randomOnly = false; render(); });
    });
    randomButton.addEventListener('click', function () { randomOnly = !randomOnly; render(); });
    showAllButton.addEventListener('click', function () { randomOnly = false; render(); });

    google.script.run.withSuccessHandler(setQuotes).withFailureHandler(showError).getQuoteCards();
  })();
</script>
